[package]
name = "deposit-agent"
version = "0.1.0+k36510"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "deposit_agent"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "=0.31.1", features = ["anchor-debug", "event-cpi", "init-if-needed"] }
anchor-spl = "=0.31.1"
utils = { path = "../../libs/utils" }
