[package]
name = "memeshot-vault-sol"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "memeshot_vault_sol"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []

[dependencies]
anchor-lang = { version = "=0.31.0", features = ["anchor-debug", "event-cpi", "init-if-needed", "lazy-account"] }
anchor-spl = "=0.31.0"
