[package]
name = "cloud-wallet"
version = "0.1.0"
description = "Created with Anchor"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "cloud_wallet"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "0.31.0", features = ["anchor-debug", "event-cpi", "init-if-needed"] }
anchor-spl = "0.31.0"
bytemuck = { version = "1", features = ["min_const_generics"] }
