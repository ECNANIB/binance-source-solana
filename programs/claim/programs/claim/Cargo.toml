[package]
name = "claim"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "claim"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []

[dependencies]
anchor-lang = { version = "=0.31.1", features = ["anchor-debug", "event-cpi", "init-if-needed"] }
anchor-spl = "=0.31.1"
bytemuck = { version = "1", features = ["derive", "min_const_generics"] }
